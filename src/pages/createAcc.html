<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="../css/style_login.css">
</head>
<body>

  <div class="blob"></div>

  <div class="content">
    <div class="icon-circle">
      <img src="../assets/running.svg" alt="Pessoa correndo">
    </div>

    <h1>Vamos começar juntos!</h1>
    <p class="subtitle">Crie sua conta e comece a se cuidar hoje</p>

    <form>
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seuemail@gmail.com">
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="•••••••">
      </div>

      <div class="field">
        <label for="confirmar-senha">Confirmar Senha</label>
        <input type="password" id="confirmar-senha" placeholder="•••••••">
      </div>

      <button type="submit" class="entrar">Criar Conta</button>
    </form>
  </div>

</body>
</html>
