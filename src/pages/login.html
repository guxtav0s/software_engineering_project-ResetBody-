<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bem-vindo de volta!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="../css/style_login.css">
</head>
<body>

  <div class="blob"></div>

  <div class="content">
    <div class="icon-circle">
      <img src="../assets/running.svg" alt="Pessoa correndo">
    </div>

    <h1>Bem-vindo de volta!</h1>
    <p class="subtitle">Entre para continuar seus alongamentos</p>

    <form>
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seuemail@gmail.com">
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="•••••••">
        <div class="forgot-row">
          <a href="#">esqueci minha senha</a>
        </div>
      </div>

      <button type="submit" class="entrar">Entrar</button>

      <p class="signup">Não tem uma conta? <a href="createAcc.html"><strong>Criar agora</strong></a></p>
    </form>
  </div>

</body>
</html>
