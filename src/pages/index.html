<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ResetBody</title>
    <link rel="stylesheet" href="../css/style_index.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com" />
  </head>

  <body>
    <div class="blob"></div>

    <nav>
      <div class="aba">
        <p>Sortear</p>
        <a href="salvos.html">Salvos</a>
      </div>

      <a href="conta.html">
        <div class="conta"><img src="../assets/foto_perfil.png" alt="FotoConta" /></div>
      </a>
    </nav>

    <div class="content">
      <h1>Um momento para respirar e se alongar</h1>
      <p class="subtitle">Pequenas pausas fazem bem ao corpo e à mente.</p>

      <!-- todo: Botão de sorteio: mudar conforme preferência do usuário -->
      <div class="botao-fundo">
        <button class="sortear">15:00</button>
      </div>
    </div>

    <footer>
      <button class="pref" id="openPreferenciasModal">
        <img src="../assets/estrela.svg" alt="Preferências" />Preferências
      </button>
      <button class="intervalo" id="openIntervaloModal">
        <img src="../assets/relogio.svg" alt="Intervalo" />Intervalo
      </button>
    </footer>

    <!-- * Dialogos preferencia e intervalo -->

    

    <dialog class="modalInt" id="intervaloModal">
      <h3>Configurar intervalo</h3>
      <p>Escolha a duração da pausa (em minutos):</p>

      <input type="number" id="duracaoPausa" min="1" max="60" />
      <sub>De 1 a 60</sub>

      <div class="modal-footer">
        <button id="cancelarIntervalo" class="cancel" type="reset">
          Cancelar
        </button>
        <button id="salvarIntervalo" class="save" type="submit">Salvar</button>
      </div>
    </dialog>

    <dialog class="modalPref" id="preferenciasModal">
      <div class="modal-header">
        <h3>Configurar preferências</h3>
        <button class="close" id="closePref">&times;</button>
      </div>
      <p>Quais alongamentos vai fazer hoje?</p>

      <div class="preferencias-lista">
        <!-- * lista de preferências -->
        <label class="pref-radio selecionado"
          ><input
            type="radio"
            name="preferencia"
            value="alongamento1"
            checked
          />
          <strong>Alongamento 1 </strong> <br />
          descrição</label
        >
        <label class="pref-radio"
          ><input type="radio" name="preferencia" value="alongamento2" />
          <strong>Alongamento 2 </strong> <br />
          descrição</label
        >
        <label class="pref-radio"
          ><input type="radio" name="preferencia" value="alongamento3" />
          <strong>Alongamento 3 </strong> <br />
          descrição</label
        >
        <label class="pref-radio"
          ><input type="radio" name="preferencia" value="alongamento4" />
          <strong>Alongamento 4 </strong> <br />
          descrição</label
        >
        <label class="pref-radio"
          ><input type="radio" name="preferencia" value="alongamento5" />
          <strong>Alongamento 5 </strong> <br />
          descrição</label
        >
      </div>
    </dialog>

    <script src="../js/index.js"></script>
  </body>
</html>
