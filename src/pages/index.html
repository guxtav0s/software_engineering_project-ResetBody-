<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResetBody</title>
    <link rel="stylesheet" href="../css/style_index.css"/>
</head>
<body>
    <div class="blob"></div>

    <nav>
        <div class="aba">
            <p>Sortear</p>
            <a href="salvos.html">Salvos</a>
        </div>

        <a href=""><div class="conta"><img src="../assets/conta.svg" alt="Conta"></div></a>
    </nav>

    <div class="content">
        <h1>Um momento para respirar e se alongar</h1>
        <p class="subtitle">Pequenas pausas fazem bem ao corpo e à mente.</p>

        <!-- todo: Botão de sorteio: mudar conforme preferência do usuário -->
        <div class="botao-fundo">
            <button class="sortear">15:00</button>
        </div>
    </div>

    <footer>
        <button class="pref"><img src="../assets/estrela.svg" alt="Preferências">Preferências</button>
        <button class="intervalo" id="openIntervaloModal"><img src="../assets/relogio.svg" alt="Intervalo">Intervalo</button>
    </footer>

    <!-- * Dialogos preferencia e intervalo -->

    <dialog class="modal" id="intervaloModal">
      
      <h3>Configurar intervalo</h3>
      <p>Escolha a duração da pausa (em minutos):</p>

      <input type="number" id="duracaoPausa" min="1" max="60" />
      <sub>De 1 a 60</sub>

      <div class="modal-footer">
        <button id="cancelar" class="cancel">Cancelar</button>
        <button id="salvar" class="save">Salvar</button>
      </div>

    </dialog>

    <script src="../js/index.js"></script>
</body>
</html>
