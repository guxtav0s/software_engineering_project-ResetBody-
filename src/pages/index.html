<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResetBody - Cadastro</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar">
    <ul>
      <li><a href="#">Page 1</a></li>
      <li><a href="#">Page 2</a></li>
      <li><a href="#">Page 3</a></li>
      <li><a href="#">Page 4</a></li>
      <li><a href="#">Page 5</a></li>
      <li class="active"><a href="#">Page 6</a></li>
    </ul>
  </nav>

  <main class="container">
    <div class="icon">
      <!-- Ícone de pessoa andando -->
      <img src="../assets/walk-icon.png" alt="Ícone caminhada">
    </div>

    <h1>Vamos começar juntos!</h1>
    <p>Crie sua conta e comece a se cuidar hoje</p>

    <form class="form-cadastro">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="seuemail@gmail.com" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Digite sua senha" required>

      <label for="confirmar">Confirmar senha</label>
      <input type="password" id="confirmar" placeholder="Repita sua senha" required>

      <button type="submit">Entrar</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 ResetBody</p>
  </footer>
</body>
</html>
